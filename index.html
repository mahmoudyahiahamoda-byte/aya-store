<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض آية - التسوق الإلكتروني</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #feee00; --secondary: #000000; --bg: #f8fafc; }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: #0f172a; }

    header { background: var(--secondary); color: white; position: sticky; top: 0; z-index: 100; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 5%; background: #111; gap: 10px; }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); text-decoration: none; }
    .search-bar { flex: 1; max-width: 500px; }
    .search-bar input { width: 100%; padding: 8px 12px; border-radius: 6px; border: none; outline: none; }
    .cart-btn { background: var(--primary); color: black; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; display: flex; align-items: center; gap: 6px; }

    .categories-bar { display: flex; gap: 10px; padding: 10px 5%; background: #222; overflow-x: auto; }
    .cat-item { color: #ccc; cursor: pointer; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; white-space: nowrap; }
    .cat-item.active { background: var(--primary); color: black; font-weight: bold; }

    .container { padding: 20px 5%; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 15px; margin-top: 15px; }

    .product-card { background: white; border-radius: 8px; border: 1px solid #e2e8f0; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
    .product-img { width: 100%; height: 140px; object-fit: contain; border-radius: 6px; }
    .product-title { font-size: 0.9rem; font-weight: 700; margin-top: 8px; line-height: 1.3; height: 2.6em; overflow: hidden; }
    .product-desc { font-size: 0.75rem; color: #64748b; margin-top: 4px; height: 2.2em; overflow: hidden; }
    .price { font-size: 1.1rem; font-weight: 800; color: #0f172a; margin-top: 8px; }
    .add-to-cart { width: 100%; background: var(--primary); border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }

    .cart-drawer { position: fixed; top: 0; left: -350px; width: 320px; height: 100%; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.2); z-index: 1000; transition: 0.3s; padding: 20px; display: flex; flex-direction: column; }
    .cart-drawer.open { left: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .cart-items { flex: 1; overflow-y: auto; margin: 15px 0; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
    .checkout-btn { background: #16a34a; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <a href="#" class="logo">معرض آية ⚡</a>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
      </div>
      <button class="cart-btn" id="openCartBtn">
        <i class="fas fa-shopping-cart"></i> (<span id="cartCount">0</span>)
      </button>
    </div>

    <div class="categories-bar" id="categoriesBar">
      <div class="cat-item active" data-cat="الكل">الكل</div>
      <div class="cat-item" data-cat="أدوات كهربائية">أدوات كهربائية</div>
      <div class="cat-item" data-cat="أدوات صحية">أدوات صحية</div>
      <div class="cat-item" data-cat="قطع غيار">قطع غيار أجهزة</div>
      <div class="cat-item" data-cat="إضاءة">إضاءة وديكور</div>
    </div>
  </header>

  <div class="container">
    <h3 style="border-right: 4px solid var(--primary); padding-right: 8px;">المنتجات المتاحة</h3>
    <div class="products-grid" id="productsGrid">جاري تحضير المتجر...</div>
  </div>

  <!-- السلة الجانبية -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>🛒 سلة الشراء</h3>
      <button id="closeCartBtn" style="border:none; background:none; font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    <div class="cart-items" id="cartItems">السلة فارغة</div>
    <div>
      <h4 style="margin-bottom:10px;">الإجمالي: <span id="cartTotal">0</span> جنيه</h4>
      <button class="checkout-btn" id="checkoutBtn">إتمام الطلب عبر الواتساب 📱</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDYuLYwpX2p2vRKIUZ2y7d9jOlxF1y7aHE",
      authDomain: "aya-store-db575.firebaseapp.com",
      projectId: "aya-store-db575",
      storageBucket: "aya-store-db575.firebasestorage.app",
      messagingSenderId: "853849172787",
      appId: "1:853849172787:web:f5655375d70d6a6c10ec46",
      measurementId: "G-5FY4XD0H9N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];
    let cart = [];

    onSnapshot(collection(db, "products"), (snapshot) => {
      allProducts = [];
      snapshot.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
      renderProducts(allProducts);
    });

    function renderProducts(products) {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";
      if (products.length === 0) {
        grid.innerHTML = "<p>لا توجد منتجات مسجلة حالياً.</p>";
        return;
      }
      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
            <div>
              <div class="product-title">${p.name}</div>
              <div class="product-desc">${p.description}</div>
            </div>
            <div>
              <div class="price">${p.price} ج.م</div>
              <button class="add-to-cart" onclick="window.addToCart('${p.id}')">إضافة للسلة 🛒</button>
            </div>
          </div>
        `;
      });
    }

    window.addToCart = (id) => {
      const prod = allProducts.find(p => p.id === id);
      if (prod) {
        cart.push(prod);
        updateCart();
      }
    };

    function updateCart() {
      document.getElementById("cartCount").innerText = cart.length;
      const container = document.getElementById("cartItems");
      let total = 0;
      container.innerHTML = "";
      if (cart.length === 0) {
        container.innerHTML = "السلة فارغة";
      }
      cart.forEach((item, i) => {
        total += item.price;
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong>
              <div>${item.price} ج.م</div>
            </div>
            <button onclick="window.removeFromCart(${i})" style="color:red; border:none; background:none; cursor:pointer;">حذف</button>
          </div>
        `;
      });
      document.getElementById("cartTotal").innerText = total;
    }

    window.removeFromCart = (i) => {
      cart.splice(i, 1);
      updateCart();
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    });

    document.querySelectorAll(".cat-item").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-item").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const cat = btn.dataset.cat;
        renderProducts(cat === "الكل" ? allProducts : allProducts.filter(p => p.category === cat));
      });
    });

    document.getElementById("openCartBtn").onclick = () => document.getElementById("cartDrawer").classList.add("open");
    document.getElementById("closeCartBtn").onclick = () => document.getElementById("cartDrawer").classList.remove("open");

    document.getElementById("checkoutBtn").onclick = () => {
      if(cart.length === 0) return alert("السلة فارغة!");
      let msg = "مرحباً معرض آية، أريد طلب المنتجات التالية:\n\n";
      cart.forEach(item => msg += `- ${item.name} بسعر ${item.price} ج.م\n`);
      msg += `\nالإجمالي: ${document.getElementById("cartTotal").innerText} جنيه`;
      window.open(`https://wa.me/201229803425?text=${encodeURIComponent(msg)}`);
    };
  </script>
</body>
</html>
