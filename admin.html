<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - معرض آية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: #f1f5f9; padding: 1.5rem; color: #0f172a; }
    .container { max-width: 900px; margin: auto; }
    .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 2rem; }
    h2 { margin-bottom: 1rem; color: #0f172a; border-right: 4px solid #feee00; padding-right: 10px; }
    label { font-weight: bold; font-size: 0.9rem; display: block; margin-top: 0.8rem; }
    input, select, textarea { width: 100%; padding: 0.7rem; margin-top: 0.3rem; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
    textarea { resize: vertical; min-height: 80px; }
    button { background: #16a34a; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem; width: 100%; font-size: 1rem; }
    .cancel-btn { background: #64748b; margin-top: 0.5rem; display: none; }
    .product-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .product-img { width: 65px; height: 65px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; }
    .action-btns { display: flex; gap: 8px; }
    .edit-btn { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; width: auto; }
    .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; width: auto; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2 id="formTitle">🛠️ إضافة منتج جديد - لوحة الإدارة</h2>
      <form id="addProductForm">
        <input type="hidden" id="editDocId" value="">
        
        <label>اسم المنتج الكامل:</label>
        <input type="text" id="pName" required placeholder="مثال: مفتاح أوتوماتيك شنايدر 63 أمبير">

        <label>الوصف التفصيلي للمنتج:</label>
        <textarea id="pDesc" placeholder="اكتب المواصفات الفنية، المقاس، أو الضمان..."></textarea>

        <label>القسم:</label>
        <select id="pCategory">
          <option value="أدوات كهربائية">أدوات كهربائية</option>
          <option value="أدوات صحية">أدوات صحية</option>
          <option value="قطع غيار">قطع غيار أجهزة منزلية</option>
          <option value="إضاءة">إضاءة وديكور</option>
        </select>

        <label>السعر (جنيه):</label>
        <input type="number" id="pPrice" required placeholder="120">

        <label>الكمية المتوفرة بالمخزن:</label>
        <input type="number" id="pStock" required placeholder="50">

        <label>صورة المنتج (اختر صورة جديدة إذا أردت تغييرها):</label>
        <input type="file" id="pImgFile" accept="image/*">

        <button type="submit" id="saveBtn">🚀 رفع وحفظ المنتج أونلاين</button>
        <button type="button" id="cancelEditBtn" class="cancel-btn">إلغاء التعديل</button>
      </form>
    </div>

    <div class="card">
      <h2>📦 المخزون والمنتجات المتاحة</h2>
      <div id="productsList">جاري التحميل...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // إعدادات فايربيس الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyDYuLYwpX2p2vRKIUZ2y7d9jOlxF1y7aHE",
      authDomain: "aya-store-db575.firebaseapp.com",
      projectId: "aya-store-db575",
      storageBucket: "aya-store-db575.firebasestorage.app",
      messagingSenderId: "853849172787",
      appId: "1:853849172787:web:f5655375d70d6a6c10ec46",
      measurementId: "G-5FY4XD0H9N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let localProducts = {};

    // 1. حفظ أو تحديث المنتج
    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      const editId = document.getElementById("editDocId").value;
      
      saveBtn.innerText = "جاري الحفظ والرفع...";
      saveBtn.disabled = true;

      const fileInput = document.getElementById("pImgFile");
      const file = fileInput.files[0];

      try {
        let imageUrl = null;
        if (file) {
          const storageRef = ref(storage, 'products/' + Date.now() + '_' + file.name);
          const uploadResult = await uploadBytes(storageRef, file);
          imageUrl = await getDownloadURL(uploadResult.ref);
        }

        if (editId) {
          // حالة التعديل
          const updateData = {
            name: document.getElementById("pName").value,
            description: document.getElementById("pDesc").value || "لا يوجد وصف.",
            category: document.getElementById("pCategory").value,
            price: Number(document.getElementById("pPrice").value),
            stock: Number(document.getElementById("pStock").value),
          };
          if (imageUrl) updateData.img = imageUrl;

          await updateDoc(doc(db, "products", editId), updateData);
          alert("✅ تم تعديل بيانات المنتج بنجاح!");
        } else {
          // حالة الإضافة الجديدة
          await addDoc(collection(db, "products"), {
            name: document.getElementById("pName").value,
            description: document.getElementById("pDesc").value || "لا يوجد وصف.",
            category: document.getElementById("pCategory").value,
            price: Number(document.getElementById("pPrice").value),
            stock: Number(document.getElementById("pStock").value),
            img: imageUrl || "https://via.placeholder.com/150?text=لا+توجد+صورة",
            createdAt: serverTimestamp()
          });
          alert("✅ تم إضافة المنتج بنجاح إلى المتجر!");
        }

        resetForm();
      } catch (error) {
        alert("❌ حدث خطأ: " + error.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "🚀 رفع وحفظ المنتج أونلاين";
      }
    });

    // 2. عرض المنتجات
    onSnapshot(collection(db, "products"), (snapshot) => {
      const container = document.getElementById("productsList");
      container.innerHTML = "";
      localProducts = {};
      
      if(snapshot.empty) {
        container.innerHTML = "<p>لا توجد منتجات مسجلة حالياً.</p>";
        return;
      }
      
      snapshot.forEach((pDoc) => {
        const p = pDoc.data();
        localProducts[pDoc.id] = p;
        container.innerHTML += `
          <div class="product-item">
            <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
            <div style="flex-grow:1;">
              <strong>${p.name}</strong> <small>(${p.category})</small>
              <div style="font-size:0.85rem; color:#64748b;">${p.description}</div>
              <div style="color:#16a34a; font-weight:bold;">${p.price} ج.م | المخزون: ${p.stock} قطعة</div>
            </div>
            <div class="action-btns">
              <button class="edit-btn" onclick="window.startEdit('${pDoc.id}')">تعديل ✏️</button>
              <button class="delete-btn" onclick="window.deleteProduct('${pDoc.id}')">حذف 🗑️</button>
            </div>
          </div>
        `;
      });
    });

    // 3. تجهيز النموذج للتعديل
    window.startEdit = (id) => {
      const p = localProducts[id];
      if(!p) return;

      document.getElementById("editDocId").value = id;
      document.getElementById("pName").value = p.name;
      document.getElementById("pDesc").value = p.description === "لا يوجد وصف." ? "" : p.description;
      document.getElementById("pCategory").value = p.category;
      document.getElementById("pPrice").value = p.price;
      document.getElementById("pStock").value = p.stock;

      document.getElementById("formTitle").innerText = "✏️ تعديل بيانات المنتج";
      document.getElementById("saveBtn").innerText = "💾 حفظ التعديلات";
      document.getElementById("cancelEditBtn").style.display = "block";

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById("cancelEditBtn").onclick = resetForm;

    function resetForm() {
      document.getElementById("addProductForm").reset();
      document.getElementById("editDocId").value = "";
      document.getElementById("formTitle").innerText = "🛠️ إضافة منتج جديد - لوحة الإدارة";
      document.getElementById("saveBtn").innerText = "🚀 رفع وحفظ المنتج أونلاين";
      document.getElementById("cancelEditBtn").style.display = "none";
    }

    window.deleteProduct = async (id) => {
      if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
        try {
          await deleteDoc(doc(db, "products", id));
          alert("🗑️ تم حذف المنتج بنجاح.");
        } catch (err) {
          alert("❌ حدث خطأ أثناء الحذف: " + err.message);
        }
      }
    };
  </script>
</body>
</html>
