<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - معرض ايه</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root{--primary:#e67e22;--primary-dark:#d35400;--secondary:#2c3e50;--accent:#f39c12;--bg:#f4f6f8;--card:#fff;--text:#2c3e50;--text-light:#7f8c8d;--border:#e0e0e0;--shadow:0 2px 10px rgba(0,0,0,.08);--radius:12px;--danger:#e74c3c;--success:#27ae60;--warning:#f1c40f}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:70px}
        a{text-decoration:none;color:inherit}img{max-width:100%}
        .login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--secondary);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
        .login-screen.hidden{opacity:0;pointer-events:none}
        .login-box{background:#fff;padding:30px;border-radius:var(--radius);width:90%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
        .login-box h2{text-align:center;margin-bottom:25px;color:var(--secondary)}
        .form-group{margin-bottom:15px}
        .form-group label{display:block;font-weight:600;margin-bottom:5px;font-size:.9rem}
        .form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:1rem;outline:none;background:var(--card);color:var(--text)}
        .btn{padding:12px 25px;border:none;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;font-size:1rem;transition:all .3s;display:inline-flex;align-items:center;gap:8px}
        .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
        .btn-secondary{background:var(--secondary);color:#fff}.btn-danger{background:var(--danger);color:#fff}
        .btn-success{background:var(--success);color:#fff}.btn-sm{padding:8px 15px;font-size:.85rem}
        .admin-header{background:var(--secondary);color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
        .admin-header h1{font-size:1.3rem}
        .admin-header .actions button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 15px;border-radius:8px;cursor:pointer;font-family:inherit;margin-right:5px}
        .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
        .tab-btn{padding:12px 20px;border:none;background:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.95rem;color:var(--text-light);white-space:nowrap;position:relative}
        .tab-btn.active{color:var(--primary)}.tab-btn.active::after{content:'';position:absolute;bottom:0;right:0;left:0;height:3px;background:var(--primary)}
        .tab-content{padding:20px;display:none}.tab-content.active{display:block}
        .form-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
        .form-card h3{margin-bottom:15px;font-size:1.2rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        .admin-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
        .admin-product-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
        .admin-product-image{width:100%;height:180px;object-fit:cover}
        .admin-product-info{padding:15px}
        .admin-product-name{font-weight:700;margin-bottom:5px}
        .admin-product-price{color:var(--primary);font-weight:900;font-size:1.2rem}
        .admin-product-actions{display:flex;gap:8px;margin-top:10px}
        .order-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:15px;border-right:4px solid var(--primary)}
        .order-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
        .order-status{padding:5px 15px;border-radius:30px;font-size:.8rem;font-weight:700}
        .status-pending{background:#fff3cd;color:#856404}.status-confirmed{background:#cce5ff;color:#004085}
        .status-shipped{background:#d1ecf1;color:#0c5460}.status-delivered{background:#d4edda;color:#155724}
        .status-cancelled{background:#f8d7da;color:#721c24}
        .order-items{list-style:none;padding:0;margin:10px 0}
        .order-items li{padding:5px 0;border-bottom:1px solid var(--border);font-size:.9rem}
        .order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
        .order-actions select{padding:8px;border-radius:8px;border:1px solid var(--border);font-family:inherit;flex:1;min-width:150px;background:var(--card);color:var(--text)}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:25px}
        .stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center}
        .stat-icon{font-size:2rem;color:var(--primary);margin-bottom:10px}
        .stat-value{font-size:1.5rem;font-weight:900}.stat-label{font-size:.85rem;color:var(--text-light)}
        .image-preview{width:120px;height:120px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:10px;cursor:pointer;position:relative}
        .image-preview img{width:100%;height:100%;object-fit:cover}
        .image-preview .placeholder{color:var(--text-light);text-align:center;font-size:.8rem}
        .toast{position:fixed;bottom:20px;right:20px;background:var(--secondary);color:#fff;padding:12px 20px;border-radius:30px;z-index:5000;box-shadow:0 4px 15px rgba(0,0,0,.2);animation:slideIn .3s;font-weight:600;font-size:.9rem}
        @keyframes slideIn{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
        @media(max-width:600px){.form-row{grid-template-columns:1fr}.admin-products{grid-template-columns:1fr}.tabs{font-size:.8rem}.tab-btn{padding:10px 12px;font-size:.8rem}}
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> لوحة الإدارة</h2>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="emailInput" placeholder="admin@aya.store"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" id="passwordInput" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()"></div>
            <button class="btn btn-primary" style="width:100%;" onclick="login()">دخول</button>
            <div class="login-error" id="loginError" style="color:var(--danger);text-align:center;margin-top:10px;min-height:20px;"></div>
        </div>
    </div>
    <div class="admin-header">
        <h1><i class="fas fa-bolt"></i> معرض ايه - الإدارة</h1>
        <div class="actions">
            <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')"><i class="fas fa-chart-bar"></i> الإحصائيات</button>
        <button class="tab-btn" data-tab="products" onclick="switchTab('products')"><i class="fas fa-box"></i> المنتجات</button>
        <button class="tab-btn" data-tab="orders" onclick="switchTab('orders')"><i class="fas fa-shopping-cart"></i> الطلبات</button>
        <button class="tab-btn" data-tab="categories" onclick="switchTab('categories')"><i class="fas fa-tags"></i> الفئات</button>
        <button class="tab-btn" data-tab="coupons" onclick="switchTab('coupons')"><i class="fas fa-ticket-alt"></i> الكوبونات</button>
        <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')"><i class="fas fa-cog"></i> الإعدادات</button>
    </div>
    <div class="tab-content active" id="tab-dashboard">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="form-card"><h3>المبيعات (آخر 7 أيام)</h3><canvas id="salesChart" height="100"></canvas></div>
        <div class="form-card"><h3>تنبيهات المخزون</h3><div id="lowStockAlerts"></div></div>
    </div>
    <div class="tab-content" id="tab-products">
        <div class="form-card">
            <h3 id="productFormTitle"><i class="fas fa-plus-circle"></i> إضافة منتج</h3>
            <div class="form-row">
                <div class="form-group"><label>اسم المنتج *</label><input type="text" id="productName"></div>
                <div class="form-group"><label>الفئة *</label><select id="productCategory"></select></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>السعر (ج.م) *</label><input type="number" id="productPrice" step="0.01"></div>
                <div class="form-group"><label>السعر قبل الخصم</label><input type="number" id="productOldPrice" step="0.01"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>الكمية *</label><input type="number" id="productStock"></div>
                <div class="form-group"><label>التقييم</label><input type="number" id="productRating" step="0.1" max="5"></div>
            </div>
            <div class="form-group"><label>الوصف</label><textarea id="productDescription"></textarea></div>
            <div class="form-group"><label>صور المنتج (حتى 3)</label>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <div class="image-preview" onclick="document.getElementById('imageInput1').click()"><img id="preview1" style="display:none;"><div class="placeholder" id="ph1"><i class="fas fa-camera"></i> صورة 1</div></div>
                    <div class="image-preview" onclick="document.getElementById('imageInput2').click()"><img id="preview2" style="display:none;"><div class="placeholder" id="ph2"><i class="fas fa-camera"></i> صورة 2</div></div>
                    <div class="image-preview" onclick="document.getElementById('imageInput3').click()"><img id="preview3" style="display:none;"><div class="placeholder" id="ph3"><i class="fas fa-camera"></i> صورة 3</div></div>
                </div>
                <input type="file" id="imageInput1" accept="image/*" style="display:none" onchange="handleImageUpload(1)">
                <input type="file" id="imageInput2" accept="image/*" style="display:none" onchange="handleImageUpload(2)">
                <input type="file" id="imageInput3" accept="image/*" style="display:none" onchange="handleImageUpload(3)">
            </div>
            <input type="hidden" id="editingProductId">
            <button class="btn btn-primary" onclick="saveProduct()"><i class="fas fa-save"></i> حفظ</button>
            <button class="btn btn-secondary" onclick="resetProductForm()"><i class="fas fa-undo"></i> إلغاء</button>
        </div>
        <div class="form-card"><h3>قائمة المنتجات (<span id="productsCount">0</span>)</h3><div class="admin-products" id="adminProductsList"></div></div>
    </div>
    <div class="tab-content" id="tab-orders">
        <div class="form-card">
            <div class="form-row">
                <div class="form-group"><label>الحالة</label><select id="orderStatusFilter" onchange="renderOrders()"><option value="all">الكل</option><option>قيد المراجعة</option><option>تم التأكيد</option><option>تم الشحن</option><option>تم التسليم</option><option>ملغي</option></select></div>
                <div class="form-group"><label>بحث</label><input type="text" id="orderSearchInput" oninput="renderOrders()" placeholder="رقم الطلب أو اسم العميل"></div>
            </div>
        </div>
        <div id="ordersList"></div>
    </div>
    <div class="tab-content" id="tab-categories">
        <div class="form-card"><h3>إضافة فئة</h3><div class="form-row"><div class="form-group"><label>اسم الفئة</label><input type="text" id="newCategoryName"></div><div class="form-group" style="display:flex;align-items:end;"><button class="btn btn-primary" onclick="addCategory()">إضافة</button></div></div></div>
        <div class="form-card"><h3>الفئات الحالية</h3><div id="categoriesList"></div></div>
    </div>
    <div class="tab-content" id="tab-coupons">
        <div class="form-card">
            <h3>إضافة كوبون</h3>
            <div class="form-row">
                <div class="form-group"><label>الكود</label><input type="text" id="couponCode"></div>
                <div class="form-group"><label>النوع</label><select id="couponType"><option value="percent">نسبة مئوية</option><option value="fixed">مبلغ ثابت</option></select></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>القيمة</label><input type="number" id="couponValue" step="0.01"></div>
                <div class="form-group"><label>مفعّل</label><select id="couponActive"><option value="true">نعم</option><option value="false">لا</option></select></div>
            </div>
            <button class="btn btn-primary" onclick="addCoupon()">حفظ الكوبون</button>
        </div>
        <div class="form-card"><h3>الكوبونات الحالية</h3><div id="couponsList"></div></div>
    </div>
    <div class="tab-content" id="tab-settings">
        <div class="form-card"><h3>تغيير كلمة المرور</h3><div class="form-row"><div class="form-group"><label>الحالية</label><input type="password" id="currentPassword"></div><div class="form-group"><label>الجديدة</label><input type="password" id="newPassword"></div></div><button class="btn btn-primary" onclick="changePassword()">حفظ</button></div>
        <div class="form-card"><h3>نسخ احتياطي</h3><button class="btn btn-secondary" onclick="exportData()">تصدير</button> <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">استيراد</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"></div>
        <div class="form-card"><h3>معلومات</h3><p>الواتساب: 01229803425</p><p>منتجات: <span id="settingsProductsCount">0</span></p><p>طلبات: <span id="settingsOrdersCount">0</span></p></div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDYuLYwpX2p2vRKIUZ2y7d9jOlxF1y7aHE",
            authDomain: "aya-store-db575.firebaseapp.com",
            projectId: "aya-store-db575",
            storageBucket: "aya-store-db575.firebasestorage.app",
            messagingSenderId: "853849172787",
            appId: "1:853849172787:web:f5655375d70d6a6c10ec46",
            measurementId: "G-5FY4XD0H9N"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();
        let products=[],orders=[],categories=[],coupons=[],editingProductId=null,uploadedImages=[];
        async function login(){
            const email=document.getElementById('emailInput').value.trim(), pass=document.getElementById('passwordInput').value;
            try{await auth.signInWithEmailAndPassword(email,pass);document.getElementById('loginScreen').classList.add('hidden');init();}
            catch(e){document.getElementById('loginError').textContent='بيانات الدخول غير صحيحة';}
        }
        function logout(){auth.signOut();document.getElementById('loginScreen').classList.remove('hidden');}
        auth.onAuthStateChanged(user=>{if(user)document.getElementById('loginScreen').classList.add('hidden');else document.getElementById('loginScreen').classList.remove('hidden');});
        function init(){setupListeners();renderAll();}
        function setupListeners(){
            db.collection('products').orderBy('createdAt','desc').onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));renderProducts();renderStats();});
            db.collection('orders').orderBy('date','desc').onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));renderOrders();renderStats();});
            db.collection('categories').orderBy('name').onSnapshot(s=>{categories=s.docs.map(d=>d.data().name);renderCategoriesSelect();renderCategoriesList();});
            db.collection('coupons').onSnapshot(s=>{coupons=s.docs.map(d=>({id:d.id,...d.data()}));renderCoupons();});
        }
        function switchTab(t){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');}
        function renderCategoriesSelect(){document.getElementById('productCategory').innerHTML='<option value="">اختر الفئة</option>'+categories.map(c=>`<option value="${c}">${c}</option>`).join('');}
        function handleImageUpload(slot){
            const file=event.target.files[0];if(!file)return;
            const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');let w=img.width,h=img.height;if(w>800){h=h*(800/w);w=800;}canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);const dataUrl=canvas.toDataURL('image/jpeg',0.7);const preview=document.getElementById('preview'+slot);preview.src=dataUrl;preview.style.display='block';document.getElementById('ph'+slot).style.display='none';uploadedImages[slot-1]=dataUrl;showToast('تم تحميل الصورة');};img.src=e.target.result;};reader.readAsDataURL(file);
        }
        async function saveProduct(){
            const name=document.getElementById('productName').value.trim(),category=document.getElementById('productCategory').value,price=parseFloat(document.getElementById('productPrice').value),oldPrice=parseFloat(document.getElementById('productOldPrice').value)||null,stock=parseInt(document.getElementById('productStock').value)||0,rating=parseFloat(document.getElementById('productRating').value)||0,description=document.getElementById('productDescription').value.trim();
            if(!name||!category||!price)return showToast('أكمل الحقول المطلوبة');
            try{
                const imageUrls=[];
                for(let i=0;i<3;i++){if(uploadedImages[i]){const ref=storage.ref('products/'+Date.now()+'_'+i+'.jpg');await ref.putString(uploadedImages[i],'data_url');imageUrls.push(await ref.getDownloadURL());}}
                if(editingProductId){await db.collection('products').doc(editingProductId).update({name,category,price,oldPrice,stock,rating,description,images:imageUrls});showToast('تم التحديث');}
                else{await db.collection('products').add({name,category,price,oldPrice,stock,rating,description,images:imageUrls,createdAt:Date.now()});showToast('تمت الإضافة');}
                resetProductForm();
            }catch(e){console.error(e);showToast('خطأ في الحفظ');}
        }
        function resetProductForm(){editingProductId=null;document.getElementById('productName').value='';document.getElementById('productCategory').value='';document.getElementById('productPrice').value='';document.getElementById('productOldPrice').value='';document.getElementById('productStock').value='';document.getElementById('productRating').value='';document.getElementById('productDescription').value='';for(let i=1;i<=3;i++){document.getElementById('preview'+i).style.display='none';document.getElementById('ph'+i).style.display='flex';uploadedImages=[];}}
        function renderProducts(){
            const c=document.getElementById('adminProductsList');document.getElementById('productsCount').textContent=products.length;
            if(products.length===0){c.innerHTML='<div style="text-align:center;padding:30px;color:var(--text-light);">لا توجد منتجات</div>';return;}
            c.innerHTML=products.map(p=>`<div class="admin-product-card"><img src="${p.images?.[0]||p.image||'https://via.placeholder.com/300x200?text=No+Image'}" class="admin-product-image" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"><div class="admin-product-info"><div class="admin-product-name">${p.name}</div><div style="font-size:.8rem;color:var(--text-light);">${p.category}</div><div class="admin-product-price">${p.price} ج.م</div><div>مخزون: ${p.stock}</div><div class="admin-product-actions"><button class="btn btn-primary btn-sm" onclick="editProduct('${p.id}')">تعديل</button><button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">حذف</button></div></div></div>`).join('');
        }
        function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingProductId=id;document.getElementById('productName').value=p.name;document.getElementById('productCategory').value=p.category;document.getElementById('productPrice').value=p.price;document.getElementById('productOldPrice').value=p.oldPrice||'';document.getElementById('productStock').value=p.stock;document.getElementById('productRating').value=p.rating||'';document.getElementById('productDescription').value=p.description||'';for(let i=1;i<=3;i++){const img=p.images?.[i-1]||p.image;if(img){document.getElementById('preview'+i).src=img;document.getElementById('preview'+i).style.display='block';document.getElementById('ph'+i).style.display='none';}else{document.getElementById('preview'+i).style.display='none';document.getElementById('ph'+i).style.display='flex';}}}
        async function deleteProduct(id){if(!confirm('حذف المنتج؟'))return;await db.collection('products').doc(id).delete();showToast('تم الحذف');}
        function renderOrders(){
            const c=document.getElementById('ordersList');const statusFilter=document.getElementById('orderStatusFilter').value;const search=document.getElementById('orderSearchInput').value.trim().toLowerCase();
            let filtered=orders;if(statusFilter!=='all')filtered=filtered.filter(o=>o.status===statusFilter);if(search)filtered=filtered.filter(o=>o.id.toLowerCase().includes(search)||o.customer.name.toLowerCase().includes(search)||o.customer.phone.includes(search));
            if(filtered.length===0){c.innerHTML='<div style="text-align:center;padding:30px;color:var(--text-light);">لا توجد طلبات</div>';return;}
            c.innerHTML=filtered.map(o=>{const st=getStatusClass(o.status);const items=o.items.map(i=>`<li>${i.name} × ${i.quantity} = ${i.total} ج.م</li>`).join('');return `<div class="order-card"><div class="order-header"><div><strong>${o.id}</strong> - ${new Date(o.date).toLocaleString('ar-EG')}</div><span class="order-status ${st}">${o.status}</span></div><p><strong>العميل:</strong> ${o.customer.name} | ${o.customer.phone}</p><p>${o.customer.city} - ${o.customer.address}</p><ul class="order-items">${items}</ul><p>شحن: ${o.shipping} - خصم: ${o.discount} - الإجمالي: <strong>${o.total} ج.م</strong></p><div class="order-actions"><select onchange="updateOrderStatus('${o.id}',this.value)"><option ${o.status==='قيد المراجعة'?'selected':''}>قيد المراجعة</option><option ${o.status==='تم التأكيد'?'selected':''}>تم التأكيد</option><option ${o.status==='تم الشحن'?'selected':''}>تم الشحن</option><option ${o.status==='تم التسليم'?'selected':''}>تم التسليم</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select><button class="btn btn-success btn-sm" onclick="contactCustomer('${o.id}')">واتساب</button><button class="btn btn-danger btn-sm" onclick="deleteOrder('${o.id}')">حذف</button></div></div>`;}).join('');
        }
        function getStatusClass(s){switch(s){case'قيد المراجعة':return'status-pending';case'تم التأكيد':return'status-confirmed';case'تم الشحن':return'status-shipped';case'تم التسليم':return'status-delivered';case'ملغي':return'status-cancelled';default:return'status-pending';}}
        async function updateOrderStatus(id,st){await db.collection('orders').doc(id).update({status:st});showToast('تم التحديث');}
        async function deleteOrder(id){if(!confirm('حذف الطلب؟'))return;await db.collection('orders').doc(id).delete();showToast('تم الحذف');}
        function contactCustomer(id){const o=orders.find(x=>x.id===id);if(!o)return;window.open(`https://wa.me/2${o.customer.phone}?text=${encodeURIComponent('مرحبًا، بخصوص طلبك '+o.id)}`);}
        async function addCategory(){const name=document.getElementById('newCategoryName').value.trim();if(!name)return;if(categories.includes(name))return showToast('موجودة');await db.collection('categories').add({name});document.getElementById('newCategoryName').value='';showToast('تمت الإضافة');}
        async function deleteCategory(cat){if(!confirm('حذف الفئة؟'))return;const s=await db.collection('categories').where('name','==',cat).get();s.forEach(d=>d.ref.delete());showToast('تم الحذف');}
        function renderCategoriesList(){document.getElementById('categoriesList').innerHTML=categories.length?categories.map(c=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--border);"><span>${c}</span><button class="btn btn-danger btn-sm" onclick="deleteCategory('${c}')">حذف</button></div>`).join(''):'<div>لا توجد فئات</div>';}
        async function addCoupon(){const code=document.getElementById('couponCode').value.trim().toUpperCase(),type=document.getElementById('couponType').value,value=parseFloat(document.getElementById('couponValue').value),active=document.getElementById('couponActive').value==='true';if(!code||!value)return showToast('أكمل البيانات');await db.collection('coupons').add({code,type,value,active});showToast('تم الحفظ');renderCoupons();}
        function renderCoupons(){const c=document.getElementById('couponsList');if(coupons.length===0){c.innerHTML='<div>لا توجد كوبونات</div>';return;}c.innerHTML=coupons.map(c=>`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--border);"><span>${c.code} - ${c.type==='percent'?c.value+'%':c.value+' ج.م'} - ${c.active?'مفعّل':'غير مفعل'}</span><button class="btn btn-danger btn-sm" onclick="deleteCoupon('${c.id}')">حذف</button></div>`).join('');}
        async function deleteCoupon(id){await db.collection('coupons').doc(id).delete();showToast('تم الحذف');}
        function renderStats(){
            const totalProducts=products.length,totalOrders=orders.length,pending=orders.filter(o=>o.status==='قيد المراجعة').length,revenue=orders.filter(o=>o.status!=='ملغي').reduce((s,o)=>s+o.total,0),lowStock=products.filter(p=>(p.stock||0)<=5).length;
            document.getElementById('statsGrid').innerHTML=`<div class="stat-card"><div class="stat-icon"><i class="fas fa-box"></i></div><div class="stat-value">${totalProducts}</div><div class="stat-label">منتج</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-shopping-cart"></i></div><div class="stat-value">${totalOrders}</div><div class="stat-label">طلب</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-hourglass-half"></i></div><div class="stat-value">${pending}</div><div class="stat-label">قيد المراجعة</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div><div class="stat-value">${revenue.toLocaleString()} ج.م</div><div class="stat-label">الإيرادات</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-value">${lowStock}</div><div class="stat-label">مخزون منخفض</div></div>`;
            document.getElementById('lowStockAlerts').innerHTML=products.filter(p=>(p.stock||0)<=5).map(p=>`<div style="padding:8px;border-bottom:1px solid var(--border);">⚠️ ${p.name} - متبقي ${p.stock}</div>`).join('')||'<div>لا توجد تنبيهات</div>';
            const ctx=document.getElementById('salesChart').getContext('2d');
            const days=7,labels=[],data=[];for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);labels.push(d.toLocaleDateString('ar-EG',{weekday:'short'}));const dayOrders=orders.filter(o=>{const od=new Date(o.date);return od.toDateString()===d.toDateString()&&o.status!=='ملغي';});data.push(dayOrders.reduce((s,o)=>s+o.total,0));}
            new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'المبيعات (ج.م)',data,backgroundColor:'#e67e22'}]},options:{responsive:true,scales:{y:{beginAtZero:true}}}});
        }
        function changePassword(){const cur=document.getElementById('currentPassword').value,newP=document.getElementById('newPassword').value;if(!cur||!newP)return;auth.currentUser.updatePassword(newP).then(()=>showToast('تم التغيير')).catch(e=>showToast('خطأ: '+e.message));}
        async function exportData(){const ps=await db.collection('products').get(),os=await db.collection('orders').get(),cs=await db.collection('categories').get(),cps=await db.collection('coupons').get();const data={products:ps.docs.map(d=>({id:d.id,...d.data()})),orders:os.docs.map(d=>({id:d.id,...d.data()})),categories:cs.docs.map(d=>({id:d.id,...d.data()})),coupons:cps.docs.map(d=>({id:d.id,...d.data()}))};const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup.json';a.click();}
        async function importData(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=async()=>{try{const data=JSON.parse(reader.result);for(const p of data.products||[]){const {id,...rest}=p;await db.collection('products').doc(id).set(rest);}for(const o of data.orders||[]){const {id,...rest}=o;await db.collection('orders').doc(id).set(rest);}for(const c of data.categories||[]){const {id,...rest}=c;await db.collection('categories').doc(id).set(rest);}for(const c of data.coupons||[]){const {id,...rest}=c;await db.collection('coupons').doc(id).set(rest);}showToast('تم الاستيراد');}catch(e){showToast('ملف غير صالح');}};reader.readAsText(f);e.target.value='';}
        function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
        document.addEventListener('DOMContentLoaded',()=>{auth.onAuthStateChanged(user=>{if(user)init();});});
    </script>
</body>
</html>
